<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광고</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #ad-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="ad-container"></div>
  <script>
    // 카카오 AdFit 공식 코드(<ins> + ba.min.js)를 그대로 넣는다. 광고 모양은 바꾸지 않는다.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var unit = params.get('unit');
      var width = params.get('width') || '320';
      var height = params.get('height') || '100';
      var slot = params.get('slot') || '';
      var reported = false;

      // 광고가 없으면 앱에 알려 자리를 접게 한다
      function report(status) {
        if (reported) return;
        reported = true;
        try {
          window.parent.postMessage({ source: 'kkeul-adfit', slot: slot, status: status }, window.location.origin);
        } catch (e) {}
      }

      if (!unit) { report('fail'); return; }

      window.kakaoAdFailCallback = function () {
        document.getElementById('ad-container').innerHTML = '';
        report('fail');
      };

      var ins = document.createElement('ins');
      ins.className = 'kakao_ad_area';
      ins.style.display = 'none';
      ins.setAttribute('data-ad-unit', unit);
      ins.setAttribute('data-ad-width', width);
      ins.setAttribute('data-ad-height', height);
      ins.setAttribute('data-ad-onfail', 'kakaoAdFailCallback');
      document.getElementById('ad-container').appendChild(ins);

      var script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = '//t1.kakaocdn.net/kas/static/ba.min.js';
      script.async = true;
      script.onerror = function () { report('fail'); }; // 광고 차단기 등
      document.body.appendChild(script);

      // 8초 안에 광고가 채워지지 않으면 없는 것으로 본다
      setTimeout(function () {
        var filled = ins.querySelector('iframe') || ins.children.length > 0;
        report(filled ? 'ok' : 'fail');
      }, 8000);
    })();
  </script>
</body>
</html>
