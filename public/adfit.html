<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKEUL AdFit</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
      background: transparent; 
    }
  </style>
</head>
<body>
  <div id="ad-container" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const unit = urlParams.get('unit');
    const width = urlParams.get('width') || '100%';
    const height = urlParams.get('height') || '100%';

    if (unit) {
      const ins = document.createElement('ins');
      ins.className = 'kakao_ad_area';
      ins.style.display = 'none';
      ins.setAttribute('data-ad-unit', unit);
      ins.setAttribute('data-ad-width', width);
      ins.setAttribute('data-ad-height', height);

      // On fail callback
      window.kakaoAdFailCallback = () => {
        document.body.innerHTML = `
          <div style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8B 100%); color: white; border-radius: 12px; font-weight: bold; padding: 20px; box-sizing: border-box; text-align: center; font-family: sans-serif;">
            <span style="font-size: 24px; margin-bottom: 8px;">KKEUL</span>
            <span style="font-size: 14px; opacity: 0.9;">Sponsored Space</span>
          </div>
        `;
      };
      ins.setAttribute('data-ad-onfail', 'kakaoAdFailCallback');

      document.getElementById('ad-container').appendChild(ins);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = '//t1.kakaocdn.net/kas/static/ba.min.js';
      script.async = true;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
